<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM vs FM: The Wise Owl's Journey</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            pointer-events: none;
            color: white;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }
        #owl-text {
            font-size: 24px;
            font-style: italic;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>AM vs FM: The Wise Owl's Journey</h1>
        <p>Controls: Arrows/WASD to Move, Space/Up to Jump (Hold for higher), Shift to Dash</p>
        <p>Find the secret doors to learn more!</p>
        <button id="start-btn">Start Journey & Music</button>
    </div>
    <div id="ui">
        <div id="owl-text">Welcome, little spark. Let us explore the waves.</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        let lastTime = 0;
        let gameRunning = false;

        // Audio System (Web Audio API)
        const audioManager = {
            ctx: null,
            started: false,

            init() {
                if (this.started) return;
                this.started = true;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                this.playMeditationDrone();
            },

            playMeditationDrone() {
                if (!this.ctx) return;

                // Base drone (low frequency)
                const osc1 = this.ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.value = 65.41; // C2

                const gain1 = this.ctx.createGain();
                gain1.gain.value = 0.15;

                // Higher harmonic
                const osc2 = this.ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = 130.81; // C3

                const gain2 = this.ctx.createGain();
                gain2.gain.value = 0.08;

                // Very slow LFO to create "breathing" effect on volume
                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.05; // 20 second cycle

                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 0.05;

                // Master gain for drone
                const masterGain = this.ctx.createGain();
                masterGain.gain.value = 0.5;

                // Connections
                lfo.connect(lfoGain);
                lfoGain.connect(masterGain.gain);

                osc1.connect(gain1);
                gain1.connect(masterGain);

                osc2.connect(gain2);
                gain2.connect(masterGain);

                masterGain.connect(this.ctx.destination);

                // Start
                osc1.start();
                osc2.start();
                lfo.start();
            },

            playJumpSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },

            playDashSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        };

        // High DPI Canvas Setup
        function resize() {
            const pixelRatio = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = w * pixelRatio;
            canvas.height = h * pixelRatio;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            ctx.scale(pixelRatio, pixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        const keys = {
            left: false, right: false, jump: false, dash: false, down: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                if (!keys.jump) player.jumpPressed();
                keys.jump = true;
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                if (!keys.dash) player.dashPressed();
                keys.dash = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                keys.jump = false;
                player.jumpReleased();
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.dash = false;
        });

        // Camera System
        const camera = {
            x: 0, y: 0,
            targetX: 0, targetY: 0,
            lerpFactor: 5,

            update(deltaTime) {
                // Target is center of screen on player
                this.targetX = player.x + player.width / 2 - window.innerWidth / 2;
                this.targetY = player.y + player.height / 2 - window.innerHeight / 2;

                // Clamp camera Y so we don't see too far below the floor
                if (this.targetY > 200) this.targetY = 200;

                // Lerp towards target
                this.x += (this.targetX - this.x) * this.lerpFactor * deltaTime;
                this.y += (this.targetY - this.y) * this.lerpFactor * deltaTime;
            },

            apply(ctx) {
                ctx.save();
                ctx.translate(-Math.round(this.x), -Math.round(this.y));
            },

            clear(ctx) {
                ctx.restore();
            }
        };

        // --- Dialogue & Wise Owl ---
        const dialogueManager = {
            element: document.getElementById('owl-text'),
            zones: [
                { x: 0, text: "Welcome, little spark. Use arrows to move, UP to jump, and SHIFT to dash." },
                { x: 500, text: "Ahead lies Amplitude Modulation (AM)." },
                { x: 1000, text: "In AM, the signal's strength (amplitude) changes, but spacing stays the same." },
                { x: 2500, text: "AM travels far, bouncing off the ionosphere, but is prone to static." },
                { x: 4000, text: "Press UP at the golden doors to uncover secrets." },
                { x: 5300, text: "Now, prepare for Frequency Modulation (FM)." },
                { x: 5600, text: "In FM, the amplitude is constant, but the spacing (frequency) changes." },
                { x: 7500, text: "FM resists static and sounds clearer, but requires line-of-sight." },
                { x: 10500, text: "You have mastered the waves. Journey well." }
            ],
            secretZones: {
                'secret_am': "Secret Room: AM radio was first successfully broadcast in 1906!",
                'secret_fm': "Secret Room: FM radio was patented in 1933 by Edwin Armstrong, improving audio fidelity immensely!"
            },
            currentText: "",

            update(playerX, playerY) {
                let newText = "";

                // Check if in secret rooms based on Y level
                if (playerY > 1500) {
                    if (playerX < 1500) newText = this.secretZones['secret_am'];
                    else newText = this.secretZones['secret_fm'];
                } else {
                    // Main level progression
                    for (let i = this.zones.length - 1; i >= 0; i--) {
                        if (playerX >= this.zones[i].x) {
                            newText = this.zones[i].text;
                            break;
                        }
                    }
                }

                if (newText !== this.currentText) {
                    this.currentText = newText;
                    if (newText) {
                        this.element.textContent = newText;
                        this.element.style.display = 'block';
                    } else {
                        this.element.style.display = 'none';
                    }
                }
            },

            drawOwl(ctx) {
                // Fixed position owl at the top of the screen (camera independent)
                const ox = window.innerWidth / 2;
                const oy = 80;

                ctx.save();

                // Body
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(ox, oy, 30, 40, 0, 0, Math.PI * 2);
                ctx.fill();

                // Belly
                ctx.fillStyle = '#D2B48C';
                ctx.beginPath();
                ctx.ellipse(ox, oy + 10, 20, 25, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(ox - 12, oy - 15, 10, 0, Math.PI * 2);
                ctx.arc(ox + 12, oy - 15, 10, 0, Math.PI * 2);
                ctx.fill();

                // Pupils
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(ox - 12, oy - 15, 4, 0, Math.PI * 2);
                ctx.arc(ox + 12, oy - 15, 4, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo(ox - 5, oy - 5);
                ctx.lineTo(ox + 5, oy - 5);
                ctx.lineTo(ox, oy + 5);
                ctx.fill();

                // Brows
                ctx.strokeStyle = '#5C3A21';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(ox - 25, oy - 25);
                ctx.lineTo(ox - 5, oy - 20);
                ctx.moveTo(ox + 25, oy - 25);
                ctx.lineTo(ox + 5, oy - 20);
                ctx.stroke();

                ctx.restore();
            }
        };

        // --- Levels & Environment ---
        const levelManager = {
            platforms: [],
            doors: [],

            init() {
                this.platforms = [];
                this.doors = [];

                // Spawn Platform
                this.platforms.push({ x: 0, y: 500, w: 800, h: 500, type: 'normal' });

                // --- AM Stage: Amplitude Modulation ---
                // Constant spacing, varying heights (amplitudes)
                let startX = 1000;
                const amBaseY = 400;
                for (let i = 0; i < 15; i++) {
                    const amplitude = (i % 2 === 0) ? -200 : 50; // high and low
                    const platW = 100;
                    this.platforms.push({
                        x: startX + i * 250,
                        y: amBaseY + amplitude,
                        w: platW,
                        h: 20,
                        type: 'am'
                    });
                }

                // Transition Platform
                let transX = startX + 15 * 250;
                this.platforms.push({ x: transX, y: 500, w: 600, h: 500, type: 'normal' });

                // Secret Door in AM section
                this.doors.push({ x: transX + 250, y: 400, w: 60, h: 100, target: 'secret_am' });

                // --- FM Stage: Frequency Modulation ---
                // Constant height, varying spacing (frequencies)
                startX = transX + 800;
                const fmBaseY = 300;
                let currentX = startX;
                for (let i = 0; i < 20; i++) {
                    // Spacing gets tighter then wider
                    const spacing = 100 + Math.sin(i * 0.5) * 80 + 150;
                    const platW = 100;
                    this.platforms.push({
                        x: currentX,
                        y: fmBaseY,
                        w: platW,
                        h: 20,
                        type: 'fm'
                    });
                    currentX += platW + spacing;
                }

                // End Platform
                this.platforms.push({ x: currentX, y: 500, w: 1000, h: 500, type: 'normal' });

                // Secret Door in FM section
                this.doors.push({ x: currentX + 300, y: 400, w: 60, h: 100, target: 'secret_fm' });

                // Secret Rooms
                // Room AM
                this.platforms.push({ x: 0, y: 2000, w: 1000, h: 100, type: 'secret' });
                this.doors.push({ x: 100, y: 1900, w: 60, h: 100, target: 'main_am' }); // Exit door

                // Room FM
                this.platforms.push({ x: 2000, y: 2000, w: 1000, h: 100, type: 'secret' });
                this.doors.push({ x: 2100, y: 1900, w: 60, h: 100, target: 'main_fm' }); // Exit door
            },

            checkCollision(player, deltaTime) {
                player.grounded = false;

                // Predict next Y position
                const nextY = player.y + player.vy * deltaTime;

                for (const p of this.platforms) {
                    // Check horizontal overlap
                    if (player.x < p.x + p.w && player.x + player.width > p.x) {
                        // Check if falling down and crossing the top edge of platform
                        if (player.vy >= 0 && player.y + player.height <= p.y && nextY + player.height >= p.y) {
                            player.y = p.y - player.height;
                            player.vy = 0;
                            player.grounded = true;
                            player.jumpsLeft = player.maxJumps;
                        }
                    }
                }

                // Door Interactions (Press Up)
                if (keys.jump) {
                    for (const d of this.doors) {
                        // AABB check
                        if (player.x < d.x + d.w && player.x + player.width > d.x &&
                            player.y < d.y + d.h && player.y + player.height > d.y) {

                            // Teleport based on door target
                            if (d.target === 'secret_am') {
                                player.x = 200; player.y = 1800;
                            } else if (d.target === 'main_am') {
                                player.x = 5500; player.y = 300;
                            } else if (d.target === 'secret_fm') {
                                player.x = 2200; player.y = 1800;
                            } else if (d.target === 'main_fm') {
                                player.x = 11000; player.y = 300;
                            }
                            // Small cooldown/reset so we don't double trigger
                            keys.jump = false;
                            player.vy = 0;
                        }
                    }
                }

                // Death plane
                if (player.y > 3000) {
                    player.x = 100;
                    player.y = 100;
                    player.vy = 0;
                }
            },

            draw(ctx) {
                // Draw platforms
                for (const p of this.platforms) {
                    if (p.type === 'am') {
                        ctx.fillStyle = '#ff4444'; // Red for AM
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#ff4444';
                    } else if (p.type === 'fm') {
                        ctx.fillStyle = '#44ff44'; // Green for FM
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#44ff44';
                    } else if (p.type === 'secret') {
                        ctx.fillStyle = '#aa44ff';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#aa44ff';
                    } else {
                        ctx.fillStyle = '#3a3f4b';
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.shadowBlur = 0;
                }

                // Draw doors
                for (const d of this.doors) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(d.x, d.y, d.w, d.h);

                    // Door glow/particles
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fillRect(d.x - 10, d.y - 10, d.w + 20, d.h + 20);
                }
            }
        };

        // Particle System
        const particleSystem = {
            particles: [],

            spawn(x, y, color, count, speed = 100, life = 0.5) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * speed;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        color: color,
                        life: life,
                        maxLife: life,
                        size: Math.random() * 4 + 2
                    });
                }
            },

            update(deltaTime) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx * deltaTime;
                    p.y += p.vy * deltaTime;
                    p.life -= deltaTime;

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            },

            draw(ctx) {
                for (let p of this.particles) {
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        };

        // Player Entity
        const player = {
            x: 100, y: 100,
            width: 30, height: 40,
            vx: 0, vy: 0,
            speed: 400, // max speed
            accel: 2500, // ground acceleration
            airAccel: 1500, // air acceleration
            friction: 2000, // ground friction
            airFriction: 500,
            gravity: 2500,
            jumpForce: -800,
            jumpHoldBoost: -100, // extra force while holding jump
            maxFallSpeed: 1000,

            grounded: false,
            jumpsLeft: 2,
            maxJumps: 2,
            isJumping: false,
            jumpHoldTimer: 0,
            maxJumpHoldTime: 0.2, // seconds you can hold jump for extra height

            dashSpeed: 1200,
            isDashing: false,
            dashDuration: 0.15,
            dashTimer: 0,
            dashCooldown: 0.6,
            dashCooldownTimer: 0,
            dashDirection: 1,

            update(deltaTime) {
                // Dash Cooldown
                if (this.dashCooldownTimer > 0) this.dashCooldownTimer -= deltaTime;

                // Dash Logic
                if (this.isDashing) {
                    this.dashTimer -= deltaTime;
                    this.vy = 0; // suspend gravity while dashing
                    this.vx = this.dashSpeed * this.dashDirection;

                    // Dash particles
                    if (Math.random() < 0.5) {
                        particleSystem.spawn(
                            this.x + this.width/2,
                            this.y + this.height/2,
                            '#00ffff', 1, 50, 0.3
                        );
                    }

                    if (this.dashTimer <= 0) {
                        this.isDashing = false;
                        this.vx = 0; // stop dash momentum mostly
                    }
                } else {
                    // Normal Horizontal Movement
                    const currentAccel = this.grounded ? this.accel : this.airAccel;
                    const currentFriction = this.grounded ? this.friction : this.airFriction;

                    if (keys.left) {
                        this.vx -= currentAccel * deltaTime;
                        this.dashDirection = -1;
                    } else if (keys.right) {
                        this.vx += currentAccel * deltaTime;
                        this.dashDirection = 1;
                    } else {
                        // Friction
                        if (this.vx > 0) {
                            this.vx -= currentFriction * deltaTime;
                            if (this.vx < 0) this.vx = 0;
                        } else if (this.vx < 0) {
                            this.vx += currentFriction * deltaTime;
                            if (this.vx > 0) this.vx = 0;
                        }
                    }

                    // Clamp speed
                    if (this.vx > this.speed) this.vx = this.speed;
                    if (this.vx < -this.speed) this.vx = -this.speed;

                    // Gravity & Variable Jump Height
                    if (!this.grounded) {
                        if (this.isJumping && keys.jump && this.jumpHoldTimer > 0) {
                            this.vy += this.jumpHoldBoost * deltaTime * (this.jumpHoldTimer / this.maxJumpHoldTime);
                            this.jumpHoldTimer -= deltaTime;
                        } else {
                            this.isJumping = false;
                        }

                        this.vy += this.gravity * deltaTime;
                        if (this.vy > this.maxFallSpeed) this.vy = this.maxFallSpeed;
                    }
                }

                // Apply velocities
                this.x += this.vx * deltaTime;
                this.y += this.vy * deltaTime;

                // Collision is now handled by levelManager
            },

            jumpPressed() {
                if (this.jumpsLeft > 0) {
                    this.vy = this.jumpForce;

                    // Jump particles
                    particleSystem.spawn(
                        this.x + this.width/2,
                        this.y + this.height,
                        this.jumpsLeft === this.maxJumps ? '#ffffff' : '#00ffff',
                        10, 150, 0.4
                    );

                    this.jumpsLeft--;
                    this.grounded = false;
                    this.isJumping = true;
                    this.jumpHoldTimer = this.maxJumpHoldTime;
                    this.isDashing = false; // cancel dash on jump
                    audioManager.playJumpSound();
                }
            },

            jumpReleased() {
                this.isJumping = false;
                // Cut jump short if going up
                if (this.vy < 0) {
                    this.vy *= 0.5;
                }
            },

            dashPressed() {
                if (this.dashCooldownTimer <= 0 && !this.isDashing) {
                    this.isDashing = true;
                    this.dashTimer = this.dashDuration;
                    this.dashCooldownTimer = this.dashCooldown;

                    // Burst particles on dash start
                    particleSystem.spawn(this.x + this.width/2, this.y + this.height/2, '#00ffff', 15, 200, 0.4);

                    audioManager.playDashSound();
                }
            },

            draw(ctx) {
                // Draw player (a simple rectangle for now, will polish later)
                ctx.fillStyle = this.isDashing ? '#00ffff' : '#ffffff';
                ctx.shadowBlur = this.isDashing ? 20 : 10;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        };

        // Game Loop
        function update(deltaTime) {
            player.update(deltaTime);
            levelManager.checkCollision(player, deltaTime);
            particleSystem.update(deltaTime);
            camera.update(deltaTime);
            dialogueManager.update(player.x, player.y);
        }

        function draw() {
            // Clear screen (camera independent)
            ctx.fillStyle = '#0d1117'; // Night sky
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Background grid pattern to help with sense of movement
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridOffsetX = -(camera.x % 100);
            const gridOffsetY = -(camera.y % 100);
            for(let i = -100; i < window.innerWidth + 100; i += 100) {
                ctx.beginPath(); ctx.moveTo(i + gridOffsetX, 0); ctx.lineTo(i + gridOffsetX, window.innerHeight); ctx.stroke();
            }
            for(let i = -100; i < window.innerHeight + 100; i += 100) {
                ctx.beginPath(); ctx.moveTo(0, i + gridOffsetY); ctx.lineTo(window.innerWidth, i + gridOffsetY); ctx.stroke();
            }
            ctx.restore();

            camera.apply(ctx);

            // Draw level
            levelManager.draw(ctx);

            // Draw particles
            particleSystem.draw(ctx);

            // Draw player
            player.draw(ctx);

            camera.clear(ctx);

            // Draw UI / HUD elements on top (camera independent)
            dialogueManager.drawOwl(ctx);
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            // Delta time in seconds (capped to avoid massive physics jumps on lag)
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTime = timestamp;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            audioManager.init();
            levelManager.init();
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
