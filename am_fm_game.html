<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM vs FM: The Wise Owl's Journey</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            pointer-events: none;
            color: white;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }
        #owl-text {
            font-size: 24px;
            font-style: italic;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>AM vs FM: The Wise Owl's Journey</h1>
        <p>Controls: Arrows/WASD to Move, Space/Up to Jump (Hold for higher), Shift to Dash</p>
        <p>Find the secret doors to learn more!</p>
        <button id="start-btn">Start Journey & Music</button>
    </div>
    <div id="ui">
        <div id="owl-text">Welcome, little spark. Let us explore the waves.</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        let lastTime = 0;
        let gameRunning = false;

        // Audio System (Web Audio API)
        const audioManager = {
            ctx: null,
            started: false,
            nextNoteTime: 0,
            currentNote: 0,

            // Celeste-like melodic progression (C Minor scale arpeggios)
            // Frequencies for C4, Eb4, G4, Bb4, C5, etc.
            notes: [
                261.63, 311.13, 392.00, 466.16, 523.25, 466.16, 392.00, 311.13, // Up and down
                261.63, 311.13, 392.00, 523.25, 622.25, 523.25, 392.00, 311.13, // Higher reach
                196.00, 261.63, 311.13, 392.00, 311.13, 261.63, 196.00, 155.56  // Lower dip (G3, C4...)
            ],
            tempo: 120, // BPM

            init() {
                if (this.started) return;
                this.started = true;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduleMusic();
            },

            playPluck(freq, time) {
                // Pluck/Piano-like envelope
                const osc = this.ctx.createOscillator();
                osc.type = 'triangle'; // gentle tone
                osc.frequency.value = freq;

                const gain = this.ctx.createGain();
                // Fast attack, exponential decay
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.2, time + 0.05); // attack
                gain.gain.exponentialRampToValueAtTime(0.001, time + 1.0); // decay/release

                // Add a bit of simple filter/echo effect by layering
                const echoDelay = this.ctx.createDelay();
                echoDelay.delayTime.value = 0.3;
                const echoGain = this.ctx.createGain();
                echoGain.gain.value = 0.3;

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                gain.connect(echoDelay);
                echoDelay.connect(echoGain);
                echoGain.connect(this.ctx.destination);

                osc.start(time);
                osc.stop(time + 1.5);
            },

            scheduleMusic() {
                if (!this.started || !this.ctx) return;

                // Schedule ahead to ensure smooth playback
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    const freq = this.notes[this.currentNote % this.notes.length];
                    this.playPluck(freq, this.nextNoteTime);

                    // Advance note and time
                    this.currentNote++;
                    const secondsPerBeat = 60.0 / this.tempo;
                    this.nextNoteTime += secondsPerBeat * 0.5; // 8th notes
                }

                // Request next frame to keep scheduler running
                // Use setTimeout to avoid coupling directly to rendering framerate
                setTimeout(() => this.scheduleMusic(), 25);
            },

            playJumpSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },

            playDashSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        };

        // High DPI Canvas Setup
        function resize() {
            const pixelRatio = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = w * pixelRatio;
            canvas.height = h * pixelRatio;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            ctx.scale(pixelRatio, pixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        const keys = {
            left: false, right: false, jump: false, dash: false, down: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                if (!keys.jump) player.jumpPressed();
                keys.jump = true;
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                if (!keys.dash) player.dashPressed();
                keys.dash = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                keys.jump = false;
                player.jumpReleased();
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.dash = false;
        });

        // Camera System
        const camera = {
            x: 0, y: 0,
            targetX: 0, targetY: 0,
            lerpFactor: 5,

            update(deltaTime) {
                // Target is center of screen on player
                this.targetX = player.x + player.width / 2 - window.innerWidth / 2;
                this.targetY = player.y + player.height / 2 - window.innerHeight / 2;

                // Clamp camera Y so we don't see too far below the floor
                if (this.targetY > 200) this.targetY = 200;

                // Lerp towards target
                this.x += (this.targetX - this.x) * this.lerpFactor * deltaTime;
                this.y += (this.targetY - this.y) * this.lerpFactor * deltaTime;
            },

            apply(ctx) {
                ctx.save();
                ctx.translate(-Math.round(this.x), -Math.round(this.y));
            },

            clear(ctx) {
                ctx.restore();
            }
        };

        // --- Images ---
        const images = {
            owl: new Image(),
            armstrong: new Image(),
            loaded: 0,
            init() {
                this.owl.src = 'owl.jpg';
                this.armstrong.src = 'armstrong.jpg';
            }
        };
        images.init();

        // --- Dialogue & Wise Owl ---
        const dialogueManager = {
            element: document.getElementById('owl-text'),
            zones: [
                { x: 0, text: "Welcome, little spark. Use arrows to move, UP to jump, and SHIFT to dash." },
                { x: 500, text: "Ahead lies Amplitude Modulation (AM)." },
                { x: 1000, text: "In AM, the signal's strength (amplitude) changes, but spacing stays the same." },
                { x: 2500, text: "AM travels far, bouncing off the ionosphere, but is prone to static." },
                { x: 4000, text: "Press UP at the golden doors to uncover secrets." },
                { x: 5300, text: "Now, prepare for Frequency Modulation (FM)." },
                { x: 5600, text: "In FM, the amplitude is constant, but the spacing (frequency) changes." },
                { x: 7500, text: "FM resists static and sounds clearer, but requires line-of-sight." },
                { x: 10500, text: "You have mastered the waves. Journey well." }
            ],
            secretZones: {
                'secret_am': "Secret Room: AM radio was first successfully broadcast in 1906!",
                'secret_fm': "Secret Room: FM radio was patented in 1933 by Edwin Armstrong, improving audio fidelity immensely!"
            },
            currentText: "",

            update(playerX, playerY) {
                let newText = "";

                // Check if in secret rooms based on Y level
                if (playerY > 1500) {
                    if (playerX < 1500) newText = this.secretZones['secret_am'];
                    else newText = this.secretZones['secret_fm'];
                } else {
                    // Main level progression
                    for (let i = this.zones.length - 1; i >= 0; i--) {
                        if (playerX >= this.zones[i].x) {
                            newText = this.zones[i].text;
                            break;
                        }
                    }
                }

                if (newText !== this.currentText) {
                    this.currentText = newText;
                    if (newText) {
                        this.element.textContent = newText;
                        this.element.style.display = 'block';
                    } else {
                        this.element.style.display = 'none';
                    }
                }
            },

            drawOwl(ctx) {
                if (!images.owl.complete) return;

                // Fixed position owl at the top of the screen (camera independent)
                const imgWidth = 100;
                const imgHeight = 100 * (images.owl.height / images.owl.width);
                const ox = window.innerWidth / 2 - imgWidth / 2;
                const oy = 20;

                ctx.save();
                // Add a subtle glow behind the image
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 20;
                ctx.drawImage(images.owl, ox, oy, imgWidth, imgHeight);
                ctx.restore();
            }
        };

        // --- Levels & Environment ---
        const levelManager = {
            platforms: [],
            doors: [],

            init() {
                this.platforms = [];
                this.doors = [];

                // Spawn Platform
                this.platforms.push({ x: 0, y: 500, w: 800, h: 500, type: 'normal' });

                // --- AM Stage: Amplitude Modulation ---
                // Constant spacing, varying heights (amplitudes)
                let startX = 1000;
                const amBaseY = 400;
                for (let i = 0; i < 15; i++) {
                    const amplitude = (i % 2 === 0) ? -200 : 50; // high and low
                    const platW = 100;
                    this.platforms.push({
                        x: startX + i * 250,
                        y: amBaseY + amplitude,
                        w: platW,
                        h: 20,
                        type: 'am'
                    });
                }

                // Transition Platform
                let transX = startX + 15 * 250;
                this.platforms.push({ x: transX, y: 500, w: 600, h: 500, type: 'normal' });

                // Secret Door in AM section
                this.doors.push({ x: transX + 250, y: 400, w: 60, h: 100, target: 'secret_am' });

                // --- FM Stage: Frequency Modulation ---
                // Constant height, varying spacing (frequencies)
                startX = transX + 800;
                const fmBaseY = 300;
                let currentX = startX;
                for (let i = 0; i < 20; i++) {
                    // Spacing gets tighter then wider
                    const spacing = 100 + Math.sin(i * 0.5) * 80 + 150;
                    const platW = 100;
                    this.platforms.push({
                        x: currentX,
                        y: fmBaseY,
                        w: platW,
                        h: 20,
                        type: 'fm'
                    });
                    currentX += platW + spacing;
                }

                // End Platform
                this.platforms.push({ x: currentX, y: 500, w: 1000, h: 500, type: 'normal' });

                // Secret Door in FM section
                this.doors.push({ x: currentX + 300, y: 400, w: 60, h: 100, target: 'secret_fm' });

                // Secret Rooms
                // Room AM - Enclosed
                this.platforms.push({ x: 0, y: 2000, w: 800, h: 50, type: 'secret' }); // Floor
                this.platforms.push({ x: -50, y: 1500, w: 50, h: 550, type: 'secret' }); // Left Wall
                this.platforms.push({ x: 800, y: 1500, w: 50, h: 550, type: 'secret' }); // Right Wall

                // Entry/Exit door is on the far right
                this.doors.push({ x: 700, y: 1900, w: 60, h: 100, target: 'main_am' });

                // Room FM - Enclosed
                this.platforms.push({ x: 2000, y: 2000, w: 800, h: 50, type: 'secret' }); // Floor
                this.platforms.push({ x: 1950, y: 1500, w: 50, h: 550, type: 'secret' }); // Left Wall
                this.platforms.push({ x: 2800, y: 1500, w: 50, h: 550, type: 'secret' }); // Right Wall

                // Entry/Exit door is on the far right
                this.doors.push({ x: 2700, y: 1900, w: 60, h: 100, target: 'main_fm' });
            },

            checkCollision(player, deltaTime) {
                player.grounded = false;

                // Predict next Y position
                const nextY = player.y + player.vy * deltaTime;

                for (const p of this.platforms) {
                    // Check horizontal overlap
                    if (player.x < p.x + p.w && player.x + player.width > p.x) {
                        // Check if falling down and crossing the top edge of platform
                        if (player.vy >= 0 && player.y + player.height <= p.y && nextY + player.height >= p.y) {
                            player.y = p.y - player.height;
                            player.vy = 0;
                            player.grounded = true;
                            player.jumpsLeft = player.maxJumps;
                        }
                    }
                }

                // Door Interactions (Press Up)
                if (keys.jump) {
                    for (const d of this.doors) {
                        // AABB check
                        if (player.x < d.x + d.w && player.x + player.width > d.x &&
                            player.y < d.y + d.h && player.y + player.height > d.y) {

                            // Teleport based on door target
                            if (d.target === 'secret_am') {
                                player.x = 50; player.y = 1800;
                            } else if (d.target === 'main_am') {
                                player.x = 4850; player.y = 300; // Back to end of AM stage
                            } else if (d.target === 'secret_fm') {
                                player.x = 2050; player.y = 1800;
                            } else if (d.target === 'main_fm') {
                                player.x = 10000; player.y = 300; // Back to end of FM stage
                            }
                            // Small cooldown/reset so we don't double trigger
                            keys.jump = false;
                            player.vy = 0;
                        }
                    }
                }

                // Death plane / Void check
                if (player.y > 1000 && player.y < 1500) {
                    // Respawn logic based on stage
                    if (player.x < 5300) {
                        // AM Stage Start
                        player.x = 100;
                        player.y = 100;
                    } else {
                        // FM Stage Start
                        player.x = 5500;
                        player.y = 300;
                    }
                    player.vy = 0;
                    player.vx = 0;
                }

                // Fall off secret rooms
                if (player.y > 2500) {
                     if (player.x < 1500) {
                        // Back to AM Secret Start
                        player.x = 200;
                        player.y = 1800;
                    } else {
                        // Back to FM Secret Start
                        player.x = 2200;
                        player.y = 1800;
                    }
                    player.vy = 0;
                    player.vx = 0;
                }
            },

            draw(ctx) {
                // Draw platforms
                for (const p of this.platforms) {
                    if (p.type === 'am') {
                        ctx.fillStyle = '#ff4444'; // Red for AM
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#ff4444';
                    } else if (p.type === 'fm') {
                        ctx.fillStyle = '#44ff44'; // Green for FM
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#44ff44';
                    } else if (p.type === 'secret') {
                        ctx.fillStyle = '#aa44ff';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#aa44ff';
                    } else {
                        ctx.fillStyle = '#3a3f4b';
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.shadowBlur = 0;
                }

                // Draw doors
                for (const d of this.doors) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(d.x, d.y, d.w, d.h);

                    // Door glow/particles
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fillRect(d.x - 10, d.y - 10, d.w + 20, d.h + 20);
                }

                // Draw Armstrong Portrait in FM Secret Room
                if (images.armstrong.complete) {
                    const ax = 2300;
                    const ay = 1600;
                    const aw = 200;
                    const ah = 200 * (images.armstrong.height / images.armstrong.width);
                    ctx.drawImage(images.armstrong, ax, ay, aw, ah);

                    // Sign under portrait
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px "Segoe UI"';
                    ctx.fillText("Thank you for saving my project", ax - 40, ay + ah + 30);
                    ctx.fillText("from being forgotten. - Edwin Armstrong", ax - 60, ay + ah + 60);
                }
            }
        };

        // Particle System
        const particleSystem = {
            particles: [],

            spawn(x, y, color, count, speed = 100, life = 0.5) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * speed;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        color: color,
                        life: life,
                        maxLife: life,
                        size: Math.random() * 4 + 2
                    });
                }
            },

            update(deltaTime) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx * deltaTime;
                    p.y += p.vy * deltaTime;
                    p.life -= deltaTime;

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            },

            draw(ctx) {
                for (let p of this.particles) {
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        };

        // Player Entity
        const player = {
            x: 100, y: 100,
            width: 30, height: 40,
            vx: 0, vy: 0,
            speed: 400, // max speed
            accel: 2500, // ground acceleration
            airAccel: 1500, // air acceleration
            friction: 2000, // ground friction
            airFriction: 500,
            gravity: 2500,
            jumpForce: -800,
            jumpHoldBoost: -100, // extra force while holding jump
            maxFallSpeed: 1000,

            grounded: false,
            jumpsLeft: 2,
            maxJumps: 2,
            isJumping: false,
            jumpHoldTimer: 0,
            maxJumpHoldTime: 0.2, // seconds you can hold jump for extra height

            dashSpeed: 1200,
            isDashing: false,
            dashDuration: 0.15,
            dashTimer: 0,
            dashCooldown: 0.6,
            dashCooldownTimer: 0,
            dashDirection: 1,

            update(deltaTime) {
                // Dash Cooldown
                if (this.dashCooldownTimer > 0) this.dashCooldownTimer -= deltaTime;

                // Dash Logic
                if (this.isDashing) {
                    this.dashTimer -= deltaTime;
                    this.vy = 0; // suspend gravity while dashing
                    this.vx = this.dashSpeed * this.dashDirection;

                    // Dash particles
                    if (Math.random() < 0.5) {
                        particleSystem.spawn(
                            this.x + this.width/2,
                            this.y + this.height/2,
                            '#00ffff', 1, 50, 0.3
                        );
                    }

                    if (this.dashTimer <= 0) {
                        this.isDashing = false;
                        this.vx = 0; // stop dash momentum mostly
                    }
                } else {
                    // Normal Horizontal Movement
                    const currentAccel = this.grounded ? this.accel : this.airAccel;
                    const currentFriction = this.grounded ? this.friction : this.airFriction;

                    if (keys.left) {
                        this.vx -= currentAccel * deltaTime;
                        this.dashDirection = -1;
                    } else if (keys.right) {
                        this.vx += currentAccel * deltaTime;
                        this.dashDirection = 1;
                    } else {
                        // Friction
                        if (this.vx > 0) {
                            this.vx -= currentFriction * deltaTime;
                            if (this.vx < 0) this.vx = 0;
                        } else if (this.vx < 0) {
                            this.vx += currentFriction * deltaTime;
                            if (this.vx > 0) this.vx = 0;
                        }
                    }

                    // Clamp speed
                    if (this.vx > this.speed) this.vx = this.speed;
                    if (this.vx < -this.speed) this.vx = -this.speed;

                    // Gravity & Variable Jump Height
                    if (!this.grounded) {
                        if (this.isJumping && keys.jump && this.jumpHoldTimer > 0) {
                            this.vy += this.jumpHoldBoost * deltaTime * (this.jumpHoldTimer / this.maxJumpHoldTime);
                            this.jumpHoldTimer -= deltaTime;
                        } else {
                            this.isJumping = false;
                        }

                        this.vy += this.gravity * deltaTime;
                        if (this.vy > this.maxFallSpeed) this.vy = this.maxFallSpeed;
                    }
                }

                // Apply velocities
                this.x += this.vx * deltaTime;
                this.y += this.vy * deltaTime;

                // Collision is now handled by levelManager
            },

            jumpPressed() {
                if (this.jumpsLeft > 0) {
                    this.vy = this.jumpForce;

                    // Jump particles
                    particleSystem.spawn(
                        this.x + this.width/2,
                        this.y + this.height,
                        this.jumpsLeft === this.maxJumps ? '#ffffff' : '#00ffff',
                        10, 150, 0.4
                    );

                    this.jumpsLeft--;
                    this.grounded = false;
                    this.isJumping = true;
                    this.jumpHoldTimer = this.maxJumpHoldTime;
                    this.isDashing = false; // cancel dash on jump
                    audioManager.playJumpSound();
                }
            },

            jumpReleased() {
                this.isJumping = false;
                // Cut jump short if going up
                if (this.vy < 0) {
                    this.vy *= 0.5;
                }
            },

            dashPressed() {
                if (this.dashCooldownTimer <= 0 && !this.isDashing) {
                    this.isDashing = true;
                    this.dashTimer = this.dashDuration;
                    this.dashCooldownTimer = this.dashCooldown;

                    // Burst particles on dash start
                    particleSystem.spawn(this.x + this.width/2, this.y + this.height/2, '#00ffff', 15, 200, 0.4);

                    audioManager.playDashSound();
                }
            },

            draw(ctx) {
                // Draw player (a simple rectangle for now, will polish later)
                ctx.fillStyle = this.isDashing ? '#00ffff' : '#ffffff';
                ctx.shadowBlur = this.isDashing ? 20 : 10;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        };

        // Game Loop
        function update(deltaTime) {
            player.update(deltaTime);
            levelManager.checkCollision(player, deltaTime);
            particleSystem.update(deltaTime);
            camera.update(deltaTime);
            dialogueManager.update(player.x, player.y);
        }

        function draw() {
            // Clear screen (camera independent)
            ctx.fillStyle = '#0d1117'; // Night sky
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Dynamic Wave Background based on player location
            ctx.save();
            const time = performance.now() / 1000;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 3;

            // Determine wave type based on player X
            let isAM = player.x < 5300;

            ctx.beginPath();
            for (let x = 0; x < window.innerWidth; x += 5) {
                // Moving the wave relative to the camera creates a parallax effect
                const worldX = x + camera.x * 0.2;

                let yOffset = 0;
                if (isAM) {
                    // AM: Constant frequency, modulating amplitude
                    const carrierFreq = 0.05;
                    const modFreq = 0.005;
                    // Amplitude changes slowly over space and time
                    const amplitude = 50 + 40 * Math.sin(worldX * modFreq - time);
                    yOffset = Math.sin(worldX * carrierFreq - time * 5) * amplitude;
                } else {
                    // FM: Constant amplitude, modulating frequency
                    const carrierFreq = 0.03;
                    const modFreq = 0.005;
                    const amplitude = 60;
                    // Frequency changes based on modulation wave
                    const freqOffset = 20 * Math.sin(worldX * modFreq - time);
                    // Integrate frequency over distance (simplified for visual effect)
                    yOffset = Math.sin((worldX * carrierFreq) + freqOffset - time * 5) * amplitude;
                }

                const y = window.innerHeight / 2 + yOffset;

                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Background grid pattern to help with sense of movement
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridOffsetX = -(camera.x % 100);
            const gridOffsetY = -(camera.y % 100);
            for(let i = -100; i < window.innerWidth + 100; i += 100) {
                ctx.beginPath(); ctx.moveTo(i + gridOffsetX, 0); ctx.lineTo(i + gridOffsetX, window.innerHeight); ctx.stroke();
            }
            for(let i = -100; i < window.innerHeight + 100; i += 100) {
                ctx.beginPath(); ctx.moveTo(0, i + gridOffsetY); ctx.lineTo(window.innerWidth, i + gridOffsetY); ctx.stroke();
            }
            ctx.restore();

            camera.apply(ctx);

            // Draw level
            levelManager.draw(ctx);

            // Draw particles
            particleSystem.draw(ctx);

            // Draw player
            player.draw(ctx);

            camera.clear(ctx);

            // Draw UI / HUD elements on top (camera independent)
            dialogueManager.drawOwl(ctx);
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            // Delta time in seconds (capped to avoid massive physics jumps on lag)
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTime = timestamp;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            audioManager.init();
            levelManager.init();
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
